  <style>
    @font-face {
      font-family: 'Martian Mono';
      src: url('fonts/MartianMono-Variable.woff2') format('woff2');
      font-weight: 100 800;
      font-stretch: 75% 112.5%;
      font-display: swap;
    }

    :root {
      --void: #0a0909;
      --bone: #ede6e1;
      --acid: #b6ff2e;
      --ash: #8e8380;
      --edge: 24px;
      --snap: cubic-bezier(.3, 1.35, .5, 1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--void);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Dot field: ignition on load, then the Sea idle field */
    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    main {
      position: relative;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    /* The lockup and the glitch canvas sit on top of each other */
    .logo {
      position: relative;
      width: 600px;
      max-width: 82vw;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .logo svg { display: block; width: 100%; height: auto; overflow: visible; }
    .logo canvas {
      position: absolute;
      left: -10%;
      top: -60%;
      width: 120%;
      height: 220%;
      pointer-events: none;
      visibility: hidden;
    }
    .logo.is-glitching svg { visibility: hidden; }
    .logo.is-glitching canvas { visibility: visible; }
    .logo:focus-visible { outline: 2px solid var(--acid); outline-offset: 12px; }

    /* Mark trace outline, used only during boot */
    .trace path {
      fill: none;
      stroke: var(--bone);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
      opacity: 0;
    }

    /* Before the script runs the lockup shows complete, so the page never sits empty */
    .booting .fill,
    .booting .wm { visibility: hidden; }

    /* Registration marks: acid plus signs in two corners */
    .reg {
      position: fixed;
      width: 18px;
      height: 18px;
      pointer-events: none;
    }
    .reg::before, .reg::after { content: ""; position: absolute; background: var(--acid); }
    .reg::before { left: 50%; top: 0; width: 1px; height: 100%; }
    .reg::after { top: 50%; left: 0; height: 1px; width: 100%; }
    .reg-tl { top: var(--edge); left: var(--edge); }
    .reg-br { bottom: var(--edge); right: var(--edge); }

    /* Corner labels in the mono label style */
    .hud {
      position: fixed;
      margin: 0;
      font-family: 'Martian Mono', ui-monospace, Menlo, monospace;
      font-size: 10.5px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-variation-settings: "wdth" 85;
      font-variant-numeric: tabular-nums;
      color: var(--ash);
      white-space: nowrap;
      pointer-events: none;
    }
    .hud b { font-weight: 500; color: var(--acid); }
    /* Typing cursor: zero width, so showing or hiding it never moves the text */
    .hud .cur { position: relative; display: inline-block; width: 0; height: 1em; }
    .hud .cur::after {
      content: "";
      position: absolute;
      left: .07em;
      top: -.05em;
      width: .62em;
      height: 1.1em;
      background: var(--acid);
    }
    /* The untyped part is laid out but invisible, so the right-aligned line never shifts */
    .hud .rest { visibility: hidden; }
    .hud-tr { top: var(--edge); right: var(--edge); }
    .hud-bl { bottom: var(--edge); left: var(--edge); color: var(--bone); }

    .booting-hud .reg,
    .booting-hud .hud { visibility: hidden; }

    @media (max-width: 480px) {
      :root { --edge: 16px; }
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const R2 = (a, b) => a + Math.random() * (b - a);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const logo = $('#logo'), svg = $('#logo svg');

    /* Motion tokens. Stepped keyframes carry steps(1, end) on each frame, never on the whole animation. */
    const E = { snap: 'cubic-bezier(.3,1.35,.5,1)', trace: 'cubic-bezier(.7,0,.2,1)' };
    const hard = kf => kf.map(k => ({ ...k, easing: 'steps(1, end)' }));
    const STROBE = hard([{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 0, offset: .24 }, { opacity: 1, offset: .4 }, { opacity: .35, offset: .56 }, { opacity: 1, offset: .72 }, { opacity: 1 }]);
    const TUBE = hard([{ opacity: 0 }, { opacity: .85, offset: .08 }, { opacity: 0, offset: .12 }, { opacity: 0, offset: .3 }, { opacity: .5, offset: .33 }, { opacity: .1, offset: .36 }, { opacity: 1, offset: .52 }, { opacity: .35, offset: .55 }, { opacity: 1, offset: .6 }, { opacity: 1 }]);

    /* ================= DOT FIELD =================
       14px grid, a little brighter toward the centre. Ignition: the unlit grid holds, then a ring
       expands from the centre of the screen and lights the dots acid as it passes. Idle (Sea): the dots never move;
       their grey rises and falls about 14% with a slow height field, like ocean swell from above. */
    const field = $('#field'), fx = field.getContext('2d');
    let W = 0, H = 0, dpr = 1;
    const sizeField = () => { dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight; field.width = Math.round(W * dpr); field.height = Math.round(H * dpr); };
    const origin = () => [W / 2, H / 2];
    const reach = (cx, cy) => Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy));

    function drawIgnition(p) {
      fx.setTransform(dpr, 0, 0, dpr, 0, 0); fx.clearRect(0, 0, W, H);
      const [cx, cy] = origin(), max = reach(cx, cy), R = max * p;
      for (let gx = 8; gx < W; gx += 14) for (let gy = 8; gy < H; gy += 14) {
        const d = Math.hypot(gx - cx, gy - cy), edge = Math.max(0, 1 - d / max);
        if (d > R) { fx.fillStyle = 'rgba(237,230,225,.11)'; fx.fillRect(gx - .75, gy - .75, 1.5, 1.5); continue; }
        const ring = Math.max(0, 1 - Math.abs(d - R) / 22);
        fx.fillStyle = ring > .05 && p < 1 ? `rgba(182,255,46,${.3 + ring * .7})` : `rgba(237,230,225,${.12 + edge * .2})`;
        fx.fillRect(gx - .75, gy - .75, 1.5, 1.5);
      }
    }

    const SEA = [[620, 18, 9, .34], [430, 112, 7, .26], [300, 205, 11, .2], [760, 290, 6, .2]]
      .map(([l, deg, v, w], i) => { const a = deg * Math.PI / 180; return { kx: Math.cos(a) * 2 * Math.PI / l, ky: Math.sin(a) * 2 * Math.PI / l, w: v * 2 * Math.PI / l, a: w, p: i * 1.7 }; });
    const sea = { ramp: 0, running: false, t0: performance.now() };
    function drawSea(now) {
      const t = (now - sea.t0) / 1000, amp = .14 * sea.ramp;
      fx.setTransform(dpr, 0, 0, dpr, 0, 0); fx.clearRect(0, 0, W, H);
      const [cx, cy] = origin(), max = reach(cx, cy);
      for (let gx = 8; gx < W; gx += 14) for (let gy = 8; gy < H; gy += 14) {
        let h = 0; for (const w of SEA) h += w.a * Math.sin(gx * w.kx + gy * w.ky - t * w.w + w.p);
        const rest = .12 + Math.max(0, 1 - Math.hypot(gx - cx, gy - cy) / max) * .2;
        fx.fillStyle = `rgba(237,230,225,${Math.max(.04, rest + h * amp).toFixed(3)})`;
        fx.fillRect(gx - .75, gy - .75, 1.5, 1.5);
      }
    }
    function seaLoop(now) {
      if (!sea.running) return;
      if (sea.ramp < 1) sea.ramp = Math.min(1, sea.ramp + 1 / 120);  // ramps in over about 2s
      if (!document.hidden) drawSea(now);
      requestAnimationFrame(seaLoop);
    }
    const startSea = () => { if (reduce) { sea.ramp = 0; drawSea(performance.now()); return; } if (!sea.running) { sea.running = true; requestAnimationFrame(seaLoop); } };

    function ignite() {
      return new Promise(done => {
        const t0 = performance.now(), HOLD = 450, DUR = 1300;
        const f = () => {
          const t = Math.min(1, Math.max(0, (performance.now() - t0 - HOLD) / DUR));
          const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          drawIgnition(Math.max(.0001, e));
          if (t >= 1) { done(); return; }
          requestAnimationFrame(f);
        };
        f();
      });
    }

    addEventListener('resize', () => { sizeField(); if (!sea.running) drawSea(performance.now()); glitchResize(); });

    /* ================= LOCKUP BOOT =================
       The mark traces its outline in bone, then its fill flickers on like a tube. The wordmark strobes on
       as [ / ] with the slash spinning; ASTRA types in to the left of the spinner, LABS to the right,
       then the slash settles and the brackets snap. */
    const lettersA = [...document.querySelectorAll('#wm-a path')], lettersB = [...document.querySelectorAll('#wm-b path')];
    const lb = $('#wm-lb'), sl = $('#wm-sl'), rb = $('#wm-rb'), groupA = $('#wm-a');
    const box = el => el.getBBox();

    function placeBoot(nA, nB) {
      // ASTRA grows leftward from the spinner, so its visible letters are pushed right against the slash
      const aEnd = box(lettersA[lettersA.length - 1]), sb = box(sl), lbb = box(lb), rbb = box(rb), last = box(lettersB[lettersB.length - 1]);
      const gapA = sb.x - (aEnd.x + aEnd.width), lbGap = box(lettersA[0]).x - (lbb.x + lbb.width), rbGap = rbb.x - (last.x + last.width), gapB = box(lettersB[0]).x - (sb.x + sb.width);
      let dxA;
      if (nA === 0) dxA = (sb.x - lbGap) - (lbb.x + lbb.width) - (box(lettersA[0]).x - (lbb.x + lbb.width)) + lbGap;
      else { const k = box(lettersA[nA - 1]); dxA = (sb.x - gapA) - (k.x + k.width); }
      lettersA.forEach((p, i) => p.style.visibility = i < nA ? '' : 'hidden');
      groupA.setAttribute('transform', `translate(${dxA} 0)`);
      lb.setAttribute('transform', nA === 0 ? `translate(${(sb.x - lbGap) - (lbb.x + lbb.width)} 0)` : `translate(${dxA} 0)`);
      lettersB.forEach((p, i) => p.style.visibility = i < nB ? '' : 'hidden');
      const rEdge = nB === 0 ? sb.x + sb.width + (gapB - rbGap) : (() => { const k = box(lettersB[nB - 1]); return k.x + k.width; })();
      rb.setAttribute('transform', `translate(${rEdge + rbGap - rbb.x} 0)`);
    }
    function settleBoot() {
      lettersA.concat(lettersB).forEach(p => p.style.visibility = '');
      groupA.removeAttribute('transform'); lb.removeAttribute('transform'); rb.removeAttribute('transform'); sl.removeAttribute('transform');
    }
    function spinSlash(i) {
      const b = box(sl), cx = b.x + b.width / 2, cy = b.y + b.height / 2;
      sl.setAttribute('transform', `rotate(${[0, 70, 115, 160][i % 4]} ${cx} ${cy})`);  // / — \ |
    }

    async function boot() {
      const fill = svg.querySelector('.fill'), trace = [...svg.querySelectorAll('.trace path')], wm = svg.querySelector('.wm');
      placeBoot(0, 0);
      await ignite();
      startSea();
      // mark: trace, then tube flicker
      trace.forEach((p, i) => {
        const L = p.getTotalLength();
        p.style.strokeDasharray = `${L} ${L}`;
        p.animate([{ opacity: 1, strokeDashoffset: L }, { opacity: 1, strokeDashoffset: 0, offset: .75 }, { opacity: 0, strokeDashoffset: 0 }], { duration: 1200, delay: i * 140, easing: E.trace, fill: 'both' });
      });
      await wait(650);
      svg.classList.remove('booting'); logo.classList.remove('booting');
      fill.animate(TUBE, { duration: 800, fill: 'backwards' });
      wm.style.visibility = 'hidden';
      await wait(650);
      // wordmark: [ / ] with a spinner
      wm.style.visibility = '';
      [lb, sl, rb].forEach(el => el.animate(STROBE, { duration: 340, fill: 'backwards' }));
      let i = 0; spinSlash(0);
      const spin = setInterval(() => spinSlash(++i), 90);
      await wait(480);
      for (let n = 1; n <= lettersA.length; n++) { placeBoot(n, 0); await wait(60); }
      await wait(200);
      for (let n = 1; n <= lettersB.length; n++) { placeBoot(lettersA.length, n); await wait(60); }
      await wait(220);
      clearInterval(spin); settleBoot();
      lb.animate([{ transform: 'none' }, { transform: 'translateX(-14px)', offset: .4 }, { transform: 'none' }], { duration: 360, easing: E.snap });
      rb.animate([{ transform: 'none' }, { transform: 'translateX(14px)', offset: .4 }, { transform: 'none' }], { duration: 360, easing: E.snap });
      trace.forEach(p => p.getAnimations().forEach(a => a.cancel()));
      await wait(400);
    }

    /* ================= GLITCH =================
       A burst of 7–13 stepped frames whose strength rises and falls, then snaps back clean.
       Five layers: chromatic split, line shift, block tear, frame jitter and dropout. */
    const gc = $('#glitch'); let gx = null, src = null, tint = {}, GW = 0, GH = 0, gd = 1, img = null;
    const FRINGE = { r: '#ff0000', g: '#00ff00', b: '#0000ff' };
    function glitchResize() {
      if (!img) return;
      const r = gc.getBoundingClientRect(); gd = devicePixelRatio || 1;
      GW = Math.max(2, Math.round(r.width * gd)); GH = Math.max(2, Math.round(r.height * gd));
      gc.width = GW; gc.height = GH; gx = gc.getContext('2d');
      const lr = svg.getBoundingClientRect(), w = lr.width * gd, h = lr.height * gd;
      const mk = () => { const t = document.createElement('canvas'); t.width = GW; t.height = GH; return t; };
      src = mk(); src.getContext('2d').drawImage(img, Math.round((lr.left - r.left) * gd), Math.round((lr.top - r.top) * gd), w, h);
      for (const [k, col] of Object.entries(FRINGE)) {
        const t = mk(), tx = t.getContext('2d');
        tx.drawImage(src, 0, 0); tx.globalCompositeOperation = 'multiply'; tx.fillStyle = col; tx.fillRect(0, 0, GW, GH);
        tx.globalCompositeOperation = 'destination-in'; tx.drawImage(src, 0, 0); tint[k] = t;
      }
    }
    function glitchFrame(k) {
      const x = gx, d = gd;
      x.clearRect(0, 0, GW, GH);
      const jx = Math.round(R2(-3, 3) * k) * d, jy = Math.random() < .3 ? Math.round(R2(-1, 1)) * d : 0;
      const rows = []; const band = R2(.3, .7) * GH, bw = R2(.04, .12) * GH;
      for (let y = 0; y < GH;) { const rh = Math.round(R2(1, 7)) * d, hit = Math.abs(y - band) < bw; const off = (hit ? Math.random() < .75 : Math.random() < .12 * k) ? Math.round(R2(-1, 1) * (hit ? 28 : 9) * k) * d : 0; rows.push([y, Math.min(rh, GH - y), off]); y += rh; }
      const draw = (im, ox) => { for (const [y, h, off] of rows) if (h > 0) x.drawImage(im, 0, y, GW, h, ox + jx + off, y + jy, GW, h); };
      x.globalAlpha = Math.random() < .3 + .3 * k ? R2(.15, .5) : 1;
      const ca = Math.max(1, Math.round(R2(.6, 2.6) * k)) * d, a0 = x.globalAlpha;
      x.globalCompositeOperation = 'lighter';
      draw(tint.r, ca); draw(tint.g, Math.round(R2(-.4, .4) * ca)); draw(tint.b, -ca);
      x.globalCompositeOperation = 'source-over'; x.globalAlpha = a0 * .45; draw(src, 0); x.globalAlpha = 1;
      const n = 1 + Math.floor(R2(0, 4) * k);
      for (let i = 0; i < n; i++) {
        const bw2 = R2(.05, .28) * GW, bh = Math.max(2 * d, R2(.02, .05) * GH), bx = R2(.15, .85) * GW - bw2 / 2, by = R2(.36, .64) * GH, dx = Math.round(R2(-1, 1) * 36 * k) * d;
        x.clearRect(bx, by, bw2, bh); x.drawImage(src, Math.max(0, bx), by, bw2, bh, bx + dx, by, bw2, bh);
        if (Math.random() < .3) { x.fillStyle = 'rgba(182,255,46,.9)'; x.fillRect(bx + dx, by + bh * .45, bw2 * R2(.2, .8), Math.max(d, bh * .12)); }
      }
    }
    let glitching = false;
    async function glitch(k = .6) {
      if (reduce || glitching || !src || document.hidden) return;
      glitching = true; logo.classList.add('is-glitching');
      const n = Math.round(7 + 6 * k);
      for (let i = 0; i < n; i++) { const env = Math.sin(Math.PI * (i + .5) / n); glitchFrame(k * (.4 + .6 * env) * R2(.7, 1)); await wait(R2(26, 62)); }
      logo.classList.remove('is-glitching'); glitching = false;
    }
    function scheduleIdle() { setTimeout(() => { glitch(.6); scheduleIdle(); }, R2(8000, 20000)); }

    async function loadGlitch() {
      const clone = svg.cloneNode(true);
      clone.querySelectorAll('.trace').forEach(n => n.remove());
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); clone.setAttribute('width', 904.68 * 4); clone.setAttribute('height', 105 * 4);
      clone.removeAttribute('class');
      img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone)); });
      glitchResize();
    }

    logo.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') glitch(.45); });
    logo.addEventListener('click', () => glitch(.85));
    logo.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); glitch(.85); } });

    /* ================= CLOCK ================= */
    const clock = $('#clock'), pad = n => String(n).padStart(2, '0');
    const tick = () => { const d = new Date(); clock.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; clock.dateTime = clock.textContent; setTimeout(tick, 1000 - d.getMilliseconds()); };
    tick();

    /* ================= CORNERS =================
       After the lockup lands: the registration marks align, the clock strobes on,
       then the byline types itself out. */

    // Registration align: each mark cuts in and out at two or three random spots
    // (70–130ms on, 50–120ms off), then strobes into its corner and holds. Position never animates.
    async function registerAlign() {
      const regs = [...document.querySelectorAll('.reg')];
      regs.forEach(r => r.style.opacity = 0);
      document.body.classList.remove('booting-hud');
      await Promise.all(regs.map(async (r, i) => {
        await wait(i * 110);
        for (let n = 2 + Math.floor(Math.random() * 2), k = 0; k < n; k++) {
          Object.assign(r.style, { left: R2(6, 90) + '%', top: R2(8, 82) + '%', right: 'auto', bottom: 'auto', opacity: 1 });
          await wait(R2(70, 130));
          r.style.opacity = 0;
          await wait(R2(50, 120));
        }
        r.removeAttribute('style');
        r.animate(STROBE, { duration: 340 });
        await wait(340);
      }));
    }

    // Byline types itself out behind an acid block cursor. The whole line is laid out from the start
    // with the untyped part invisible, and the cursor takes no width, so nothing ever shifts.
    async function typeByline() {
      const el = $('#byline'), parts = [['A BRAND BY ', ''], ['//', 'b'], [' EMILY ASTRANOVA', '']];
      const total = parts.reduce((n, [t]) => n + t.length, 0);
      const wrap = (t, tag) => t ? (tag ? `<${tag}>${t}</${tag}>` : t) : '';
      const render = (n, cursor) => {
        let left = n, shown = '', rest = '';
        for (const [t, tag] of parts) { const k = Math.min(t.length, Math.max(0, left)); left -= t.length; shown += wrap(t.slice(0, k), tag); rest += wrap(t.slice(k), tag); }
        el.innerHTML = shown + (cursor ? '<span class="cur"></span>' : '') + (rest ? `<span class="rest">${rest}</span>` : '');
      };
      render(0, true);
      el.style.visibility = 'visible';
      await wait(320);
      for (let n = 1; n <= total; n++) { render(n, true); await wait(n === 11 || n === 13 ? 140 : 42); }  // a beat around the //
      await wait(260);
      render(total, false);
    }

    async function corners() {
      const clockEl = $('#clock'), byline = $('#byline');
      clockEl.style.visibility = byline.style.visibility = 'hidden';
      await registerAlign();
      await wait(120);
      clockEl.style.visibility = 'visible';
      clockEl.animate(STROBE, { duration: 340 });
      await wait(520);
      await typeByline();
    }

    /* ================= START ================= */
    sizeField();
    if (reduce) { drawSea(performance.now()); loadGlitch(); return; }
    logo.classList.add('booting'); document.body.classList.add('booting-hud');
    drawIgnition(.0001);
    boot().then(() => { loadGlitch(); return corners(); }).then(scheduleIdle).catch(() => { document.body.classList.remove('booting-hud'); $('#clock').style.visibility = $('#byline').style.visibility = ''; settleBoot(); logo.classList.remove('booting'); startSea(); });
  })();
  </script>
</body>
</html>
